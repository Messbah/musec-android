name: Build MuSec Android (Phone + TV) APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MuSec Android source
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Cloud Runner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 36 Platform & Build Tools
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using sdkmanager: $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          "$SDK_MANAGER" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build Split Lean APKs (arm64-v8a + armeabi-v7a)
        run: gradle assembleRelease --no-daemon --console=plain --stacktrace

      - name: Rename Split APKs
        run: |
          mkdir -p release
          ls -lh app/build/outputs/apk/release/
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release/MuSec-Android-arm64.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk release/MuSec-Android-armv7.apk
          ls -lh release/

      - name: Upload MuSec-Android-arm64.apk (Pixel 10 Pro, Modern Phones & 64-bit TVs)
        uses: actions/upload-artifact@v4
        with:
          name: MuSec-Android-arm64-Phone-64bitTV
          path: release/MuSec-Android-arm64.apk
          retention-days: 90

      - name: Upload MuSec-Android-armv7.apk (32-bit Android TVs & Older Devices)
        uses: actions/upload-artifact@v4
        with:
          name: MuSec-Android-armv7-32bitTV
          path: release/MuSec-Android-armv7.apk
          retention-days: 90
